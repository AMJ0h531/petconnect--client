<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Owner Dashboard — PetConnect+</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --sky-50:#f0f9ff; --sky-100:#e0f2fe; --sky-200:#bae6fd;
      --sky-400:#38bdf8; --sky-500:#0ea5e9; --sky-600:#0284c7;
      --sky-700:#0369a1; --sky-900:#0c4a6e;
      --text:#0c2d45; --text-soft:#4a7fa0;
      --border:#bae6fd; --surface:#ffffff;
      --green:#059669; --green-light:#d1fae5;
      --shadow:0 4px 24px rgba(14,165,233,.10);
    }
    html { scroll-behavior:smooth; }
    body { font-family:'DM Sans',sans-serif; background:var(--sky-50); color:var(--text); min-height:100vh; }

    nav {
      position:sticky; top:0; z-index:200;
      background:rgba(240,249,255,.96); backdrop-filter:blur(10px);
      border-bottom:1.5px solid var(--sky-200);
      padding:0 48px; display:flex; align-items:center; justify-content:space-between; height:68px;
    }
    .nav-logo { font-family:'Playfair Display',serif; font-size:1.45rem; font-weight:900; color:var(--sky-700); letter-spacing:-.5px; text-decoration:none; display:flex; align-items:center; gap:6px; }
    .nav-logo .plus { background:var(--sky-500); color:#fff; font-size:.82rem; font-family:'DM Sans',sans-serif; font-weight:800; padding:2px 8px; border-radius:7px; }
    .nav-links { display:flex; gap:6px; list-style:none; }
    .nav-links a { text-decoration:none; font-size:.9rem; font-weight:500; color:var(--text-soft); padding:7px 18px; border-radius:99px; transition:background .2s,color .2s; }
    .nav-links a:hover { background:var(--sky-100); color:var(--sky-700); }
    .nav-links a.active { background:var(--sky-500); color:#fff; }

    .page-wrap { max-width:680px; margin:0 auto; padding:56px 24px 80px; }

    /* ── SIGN-IN CARD ── */
    .signin-card { background:var(--surface); border:1.5px solid var(--sky-200); border-radius:24px; padding:48px 40px; box-shadow:var(--shadow); text-align:center; }
    .signin-icon { font-size:3.5rem; display:block; margin-bottom:14px; }
    .signin-card h1 { font-family:'Playfair Display',serif; font-size:2rem; font-weight:900; color:var(--sky-900); margin-bottom:8px; }
    .signin-card p { color:var(--text-soft); font-size:.95rem; line-height:1.6; margin-bottom:32px; }
    .signin-field { text-align:left; margin-bottom:14px; }
    .signin-field label { display:block; font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.8px; color:var(--sky-700); margin-bottom:6px; }
    .signin-field input { width:100%; border:1.5px solid var(--sky-200); border-radius:10px; padding:12px 16px; font-family:'DM Sans',sans-serif; font-size:.95rem; color:var(--text); outline:none; transition:border-color .2s,box-shadow .2s; }
    .signin-field input:focus { border-color:var(--sky-500); box-shadow:0 0 0 3px rgba(14,165,233,.12); }
    .signin-error { color:#dc2626; font-size:.84rem; margin-bottom:10px; display:none; }
    .signin-error.show { display:block; }
    .btn-signin { width:100%; background:var(--sky-500); color:#fff; border:none; padding:13px; border-radius:99px; font-size:.95rem; font-weight:700; cursor:pointer; transition:background .2s; margin-top:4px; }
    .btn-signin:hover { background:var(--sky-600); }

    /* ── RESULTS ── */
    .results-header { margin-bottom:28px; }
    .results-header h1 { font-family:'Playfair Display',serif; font-size:1.9rem; font-weight:900; color:var(--sky-900); margin-bottom:6px; }
    .results-header p { color:var(--text-soft); font-size:.92rem; }
    .results-header .signout-btn { margin-top:12px; background:transparent; border:1.5px solid var(--sky-200); color:var(--text-soft); padding:7px 18px; border-radius:99px; font-size:.84rem; font-weight:600; cursor:pointer; transition:background .2s; }
    .results-header .signout-btn:hover { background:var(--sky-100); }

    .app-card { background:var(--surface); border:1.5px solid var(--sky-200); border-radius:20px; padding:28px 28px 24px; box-shadow:var(--shadow); margin-bottom:20px; }
    .app-card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
    .app-pet-name { font-family:'Playfair Display',serif; font-size:1.4rem; font-weight:900; color:var(--sky-900); }
    .app-date { font-size:.82rem; color:var(--text-soft); margin-top:4px; }

    .status-badge { display:inline-flex; align-items:center; gap:6px; font-size:.72rem; font-weight:700; letter-spacing:.8px; text-transform:uppercase; padding:5px 14px; border-radius:99px; border:1.5px solid transparent; flex-shrink:0; }
    .status-badge.pending  { background:#fef3c7; color:#92400e; border-color:rgba(146,64,14,.2); }
    .status-badge.approved { background:var(--green-light); color:var(--green); border-color:rgba(5,150,105,.2); }
    .status-badge.denied   { background:#fee2e2; color:#dc2626; border-color:rgba(220,38,38,.2); }

    /* ── STATUS BANNERS ── */
    .status-banner { border-radius:16px; padding:24px 24px 20px; margin-top:6px; }
    .status-banner.approved { background:linear-gradient(135deg,#d1fae5,#a7f3d0); border:1.5px solid rgba(5,150,105,.25); }
    .status-banner.denied   { background:linear-gradient(135deg,#fee2e2,#fecaca); border:1.5px solid rgba(220,38,38,.2); }
    .status-banner.pending  { background:linear-gradient(135deg,#fef9c3,#fef3c7); border:1.5px solid rgba(234,179,8,.2); }
    .status-banner-icon { font-size:2.4rem; display:block; margin-bottom:10px; }
    .status-banner h3 { font-family:'Playfair Display',serif; font-size:1.2rem; font-weight:700; margin-bottom:6px; }
    .status-banner.approved h3 { color:#065f46; }
    .status-banner.denied   h3 { color:#7f1d1d; }
    .status-banner.pending  h3 { color:#92400e; }
    .status-banner p { font-size:.88rem; line-height:1.6; }
    .status-banner.approved p { color:#047857; }
    .status-banner.denied   p { color:#991b1b; }
    .status-banner.pending  p { color:#92400e; }
    .denial-reason { background:rgba(0,0,0,.06); border-radius:10px; padding:12px 14px; margin-top:12px; font-size:.86rem; font-style:italic; }
    .btn-care { display:inline-block; margin-top:16px; background:var(--green); color:#fff; padding:11px 26px; border-radius:99px; font-size:.9rem; font-weight:700; text-decoration:none; transition:background .2s; }
    .btn-care:hover { background:#047857; }
    .btn-browse { display:inline-block; margin-top:14px; background:transparent; color:#dc2626; border:2px solid rgba(220,38,38,.4); padding:10px 26px; border-radius:99px; font-size:.9rem; font-weight:700; text-decoration:none; transition:background .2s,color .2s; }
    .btn-browse:hover { background:#fee2e2; }

    /* ── TOAST ── */
    .toast-container { position:fixed; bottom:28px; right:28px; z-index:9999; display:flex; flex-direction:column; gap:10px; pointer-events:none; }
    .toast { background:var(--sky-900); color:#fff; padding:14px 22px; border-radius:14px; font-size:.9rem; font-weight:500; box-shadow:0 8px 28px rgba(12,45,69,.35); transform:translateX(120%); transition:transform .4s cubic-bezier(.34,1.56,.64,1); pointer-events:auto; max-width:340px; }
    .toast.show { transform:translateX(0); }
    .toast.success { background:#065f46; }

    /* ── CONFETTI ── */
    #confetti-canvas { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:9998; display:none; }

    @media(max-width:600px) {
      nav { padding:0 20px; }
      .page-wrap { padding:36px 16px 60px; }
      .signin-card { padding:32px 22px; }
    }
  </style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>
<div class="toast-container" id="toastContainer"></div>

<nav>
  <a href="index.html" class="nav-logo">PetConnect<span class="plus">+</span></a>
  <ul class="nav-links">
    <li><a href="index.html#dogs">Dogs</a></li>
    <li><a href="cats.html">Cats</a></li>
    <li><a href="match-quiz.html">Match Quiz</a></li>
    <li><a href="owner-dashboard.html" class="active">My Application</a></li>
  </ul>
</nav>

<div class="page-wrap">

  <!-- SIGN-IN SECTION -->
  <div id="signinSection">
    <div class="signin-card">
      <span class="signin-icon">🐾</span>
      <h1>Owner Dashboard</h1>
      <p>Enter the email address you used when submitting your adoption application to check your status.</p>
      <form onsubmit="checkStatus(event)">
        <div class="signin-field">
          <label>Email Address</label>
          <input type="email" id="ownerEmail" placeholder="you@email.com" required autocomplete="email"/>
        </div>
        <div class="signin-error" id="signinError">No applications found for that email address.</div>
        <button type="submit" class="btn-signin">Check My Status</button>
      </form>
    </div>
  </div>

  <!-- RESULTS SECTION -->
  <div id="resultsSection" style="display:none;">
    <div class="results-header">
      <h1>Your Applications</h1>
      <p id="resultsSubtext"></p>
      <button class="signout-btn" onclick="signOut()">← Check a different email</button>
    </div>
    <div id="appsList"></div>
  </div>

</div>

<script>
  const APPS_KEY = 'petconnect.applications';
  let _confettiLaunched = false;

  function getApps() { return JSON.parse(localStorage.getItem(APPS_KEY) || '[]'); }

  function checkStatus(event) {
    event.preventDefault();
    const email = document.getElementById('ownerEmail').value.trim().toLowerCase();
    const apps  = getApps().filter(a => (a.applicantEmail || '').toLowerCase() === email);
    const errEl = document.getElementById('signinError');
    if (apps.length === 0) {
      errEl.classList.add('show');
      return;
    }
    errEl.classList.remove('show');
    renderResults(email, apps);
  }

  function renderResults(email, apps) {
    document.getElementById('signinSection').style.display = 'none';
    const section = document.getElementById('resultsSection');
    section.style.display = 'block';
    document.getElementById('resultsSubtext').textContent = `Showing applications for ${email}`;

    const list = document.getElementById('appsList');
    list.innerHTML = '';
    _confettiLaunched = false;

    apps.forEach(app => {
      const applied = new Date(app.createdAt).toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
      const card = document.createElement('div');
      card.className = 'app-card';

      const statusLabel = app.status.charAt(0).toUpperCase() + app.status.slice(1);
      let bannerHtml = '';

      if (app.status === 'approved') {
        bannerHtml = `
          <div class="status-banner approved">
            <span class="status-banner-icon">🎉</span>
            <h3>Congratulations — You've been approved!</h3>
            <p>Your application for <strong>${escHtml(app.petName)}</strong> has been approved by the admin. Welcome to the PetConnect+ family!</p>
            <a href="admin-dashboard.html" class="btn-care">📋 Go to Care Reminders</a>
          </div>`;
        // Launch confetti once for the first approved app
        if (!_confettiLaunched) {
          _confettiLaunched = true;
          setTimeout(launchConfetti, 300);
          showToast(`🎉 Congratulations! Your adoption of ${app.petName} was approved!`, 'success', 6000);
        }
      } else if (app.status === 'denied') {
        const reason = app.denialReason || 'No specific reason was provided.';
        bannerHtml = `
          <div class="status-banner denied">
            <span class="status-banner-icon">😔</span>
            <h3>Application Not Approved</h3>
            <p>Unfortunately your application for <strong>${escHtml(app.petName)}</strong> was not approved at this time.</p>
            <div class="denial-reason">"${escHtml(reason)}"</div>
            <a href="index.html" class="btn-browse">Browse Other Pets</a>
          </div>`;
      } else {
        bannerHtml = `
          <div class="status-banner pending">
            <span class="status-banner-icon">⏳</span>
            <h3>Under Review</h3>
            <p>Your application for <strong>${escHtml(app.petName)}</strong> is currently being reviewed by our admin team. We'll update your status here as soon as a decision is made.</p>
          </div>`;
      }

      card.innerHTML = `
        <div class="app-card-top">
          <div>
            <div class="app-pet-name">${escHtml(app.petName)}</div>
            <div class="app-date">Applied ${applied}</div>
          </div>
          <span class="status-badge ${app.status}">${statusLabel}</span>
        </div>
        ${bannerHtml}`;
      list.appendChild(card);
    });
  }

  function signOut() {
    document.getElementById('resultsSection').style.display = 'none';
    document.getElementById('signinSection').style.display = 'block';
    document.getElementById('ownerEmail').value = '';
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── CONFETTI ──
  const canvas = document.getElementById('confetti-canvas');
  const ctx    = canvas.getContext('2d');
  let particles = [], frame;
  function launchConfetti() {
    canvas.style.display = 'block';
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    particles = [];
    const colors = ['#38bdf8','#0ea5e9','#7dd3fc','#bae6fd','#fbbf24','#34d399','#a78bfa','#f472b6','#fff'];
    for (let i = 0; i < 220; i++) {
      particles.push({ x:Math.random()*canvas.width, y:Math.random()*-canvas.height, w:Math.random()*10+5, h:Math.random()*5+3, color:colors[Math.floor(Math.random()*colors.length)], angle:Math.random()*Math.PI*2, spin:(Math.random()-.5)*.2, vx:(Math.random()-.5)*3, vy:Math.random()*4+2, alpha:1 });
    }
    animateConfetti();
    setTimeout(() => { cancelAnimationFrame(frame); canvas.style.display='none'; }, 5000);
  }
  function animateConfetti() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p => {
      p.y+=p.vy; p.x+=p.vx; p.angle+=p.spin;
      if(p.y>canvas.height*.7) p.alpha-=.02;
      ctx.save(); ctx.globalAlpha=Math.max(0,p.alpha); ctx.translate(p.x,p.y); ctx.rotate(p.angle);
      ctx.fillStyle=p.color; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    frame=requestAnimationFrame(animateConfetti);
  }

  // ── TOAST ──
  function showToast(msg, type='info', duration=4000) {
    const c=document.getElementById('toastContainer');
    const t=document.createElement('div');
    t.className=`toast ${type}`;
    t.textContent=msg;
    c.appendChild(t);
    requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add('show')));
    setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),500);},duration);
  }
</script>
</body>
</html>
